[project]
name = "desk-controller"
version = "0"  # placeholder for version in src/constants.py
requires-python = ">=3.13"
dependencies = [
    "pyobjc-framework-Cocoa>=10",
    "bleak>=1.1.1,<2",
    "PyYAML~=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller"]

[tool.uv]
environments = ["sys_platform == 'darwin'"]  # macOS only
# The libyaml wheels are single-arch and break the universal2 bundle
no-binary-package = ["pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
